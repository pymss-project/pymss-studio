name: Release Windows Packages

on:
  workflow_call:
    inputs:
      version:
        description: Release version
        required: true
        type: string
      core_manifest_artifact:
        description: Shared resolved runtime manifest
        required: true
        type: string
      rocm_profile:
        description: Versioned ROCm recipe identifier
        type: string
        default: win-rocm100-multiarch
      rocm_profile_revision:
        description: Expected ROCm recipe revision
        type: number
        default: 1
      rocm_targets:
        description: Explicit space-separated GPU targets; legacy uses an empty set
        type: string
        default: all
      rocm_channel:
        description: Recipe release state (legacy, preview or stable)
        type: string
        default: preview
      rocm_preview_candidate:
        description: Publish the versioned ROCm candidate in an explicit prerelease recipe snapshot
        type: boolean
        default: false

jobs:
  windows-bundled-tools:
    name: Prepare shared Windows bundled tools
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Download and verify bundled tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-BundledFile([string]$Uri, [string]$Destination) {
            & curl.exe --location --fail --retry 2 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 300 --output $Destination $Uri
            if ($LASTEXITCODE -ne 0) { throw "Bundled tool download failed with exit code $LASTEXITCODE" }
            if ((Get-Item -LiteralPath $Destination).Length -eq 0) { throw "Bundled tool download is empty: $Destination" }
          }
          $bin = "release/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Get-BundledFile "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" "release/ffmpeg.zip"
          Expand-Archive -Path "release/ffmpeg.zip" -DestinationPath "release/ffmpeg" -Force
          $ffmpegBin = Get-ChildItem -Path "release/ffmpeg" -Recurse -Directory -Filter "bin" |
            Where-Object { Test-Path (Join-Path $_.FullName "ffmpeg.exe") } |
            Select-Object -First 1
          if (-not $ffmpegBin) { throw "ffmpeg bin directory not found" }
          foreach ($toolName in @("ffmpeg.exe", "ffprobe.exe")) {
            Copy-Item -LiteralPath (Join-Path $ffmpegBin.FullName $toolName) -Destination "$bin/$toolName" -Force
          }
          Get-BundledFile "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" "release/aria2.zip"
          Expand-Archive -Path "release/aria2.zip" -DestinationPath "release/aria2" -Force
          $aria2 = Get-ChildItem -Path "release/aria2" -Recurse -File -Filter "aria2c.exe" | Select-Object -First 1
          if (-not $aria2) { throw "aria2c.exe not found" }
          Copy-Item -LiteralPath $aria2.FullName -Destination "$bin/aria2c.exe" -Force
          Get-BundledFile "https://aka.ms/vs/17/release/vc_redist.x64.exe" "$bin/VC_redist.x64.exe"
          foreach ($toolName in @("ffmpeg.exe", "ffprobe.exe", "aria2c.exe")) {
            $versionFlag = if ($toolName -eq "aria2c.exe") { "--version" } else { "-version" }
            $versionOutput = & (Join-Path $bin $toolName) $versionFlag
            if ($LASTEXITCODE -ne 0) { throw "$toolName verification failed with exit code $LASTEXITCODE" }
            $versionOutput | Select-Object -First 1
          }
          foreach ($toolName in @("ffmpeg.exe", "ffprobe.exe", "aria2c.exe", "VC_redist.x64.exe")) {
            $toolPath = Join-Path $bin $toolName
            if ((Get-Item -LiteralPath $toolPath).Length -eq 0) { throw "Bundled tool is empty: $toolName" }
            $digest = (Get-FileHash -LiteralPath $toolPath -Algorithm SHA256).Hash
            Write-Output "$toolName SHA256: $digest"
          }
      - name: Upload shared bundled tools
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundled-tools
          path: release/bin
          compression-level: 0
          if-no-files-found: error

  windows-rocm-runtime-assets:
    name: Resolve shared ROCm binary lock and HIP detector
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYMSS_VERSION_INPUT: ${{ inputs.version }}
      PYMSS_ROCM_PROFILE: ${{ inputs.rocm_profile }}
      PYMSS_ROCM_REVISION: ${{ inputs.rocm_profile_revision }}
      PYMSS_ROCM_TARGETS: ${{ inputs.rocm_targets }}
      PYMSS_ROCM_CHANNEL: ${{ inputs.rocm_channel }}
      PYMSS_ROCM_PREVIEW_CANDIDATE: ${{ inputs.rocm_preview_candidate }}
    steps:
      - uses: actions/checkout@v4
      - name: Download shared core snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.core_manifest_artifact }}
          path: python
      - uses: ./.github/actions/setup-release-env
      - name: Restore verified source download cache
        uses: actions/cache@v4
        with:
          path: .cache/runtime-artifact-sources
          key: windows-rocm-${{ inputs.rocm_profile }}-${{ inputs.rocm_profile_revision }}-${{ inputs.rocm_targets }}-${{ inputs.rocm_channel }}-${{ hashFiles('python/runtime-manifest.json', 'python/worker_runtime_artifacts.py', 'scripts/runtime-artifacts.py') }}
      - name: Resolve complete binary closure
        shell: pwsh
        run: |
          $version = $env:PYMSS_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw 'Invalid release version' }
          $targets = @($env:PYMSS_ROCM_TARGETS -split '\s+' | Where-Object { $_ })
          $snapshotArgs = @('scripts/runtime-artifacts.py', 'snapshot', '--profile', $env:PYMSS_ROCM_PROFILE,
            '--profile-revision', $env:PYMSS_ROCM_REVISION, '--channel', $env:PYMSS_ROCM_CHANNEL,
            '--version', $version, '--output', 'release/rocm-distribution-manifest.json')
          if ($env:PYMSS_ROCM_PREVIEW_CANDIDATE -eq 'true') { $snapshotArgs += '--enable-preview-candidate' }
          & python @snapshotArgs
          if ($LASTEXITCODE -ne 0) { throw 'ROCm distribution recipe snapshot failed' }
          $arguments = @('scripts/runtime-artifacts.py', 'resolve', '--profile', $env:PYMSS_ROCM_PROFILE,
            '--profile-revision', $env:PYMSS_ROCM_REVISION, '--channel', $env:PYMSS_ROCM_CHANNEL,
            '--manifest', 'release/rocm-distribution-manifest.json',
            '--base-url', "https://github.com/${{ github.repository }}/releases/download/v$version",
            '--output', 'release/rocm-runtime-assets')
          if ($targets.Count) { $arguments += @('--targets') + $targets }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'ROCm binary lock resolution failed' }
          $manifest = Get-Content -Raw 'release/rocm-distribution-manifest.json' | ConvertFrom-Json
          $defaultProfile = $manifest.backends.rocm.platformOverrides.win32.defaultProfile
          if ($defaultProfile -ne $env:PYMSS_ROCM_PROFILE) {
            $defaultRecipe = $manifest.backends.rocm.platformOverrides.win32.profiles.$defaultProfile
            $defaultArguments = @('scripts/runtime-artifacts.py', 'resolve', '--profile', $defaultProfile,
              '--profile-revision', $defaultRecipe.revision, '--channel', $defaultRecipe.releaseState,
              '--manifest', 'release/rocm-distribution-manifest.json',
              '--base-url', "https://github.com/${{ github.repository }}/releases/download/v$version",
              '--output', 'release/rocm-runtime-assets')
            if ($defaultRecipe.installMode -eq 'multiarch') { $defaultArguments += @('--targets', 'all') }
            & python @defaultArguments
            if ($LASTEXITCODE -ne 0) { throw 'Default Online ROCm binary lock resolution failed' }
          }
          New-Item -ItemType Directory -Force 'python/runtime-locks' | Out-Null
          Get-ChildItem 'release/rocm-runtime-assets/*.json' | Where-Object { $_.Name -ne 'build-manifest.json' } | Copy-Item -Destination 'python/runtime-locks/'
          Copy-Item 'release/rocm-distribution-manifest.json' 'python/runtime-manifest.json' -Force
      - name: Build pinned no-Torch HIP inventory helper
        shell: pwsh
        run: |
          $catalog = Get-Content -Raw 'python/runtime-locks/catalog.json' | ConvertFrom-Json
          foreach ($profile in $catalog.profiles) {
            $id = $profile.profileId
            $environment = Join-Path (Resolve-Path '.').Path ".cache/rocm-detector-sdk-$id"
            python -m venv $environment
            if ($LASTEXITCODE -ne 0) { throw 'HIP detector build environment creation failed' }
            $python = Join-Path $environment 'Scripts/python.exe'
            python scripts/runtime-artifacts.py detector --lock "python/runtime-locks/$id.json" --python $python --wheelhouse release/rocm-runtime-assets/wheels
            if ($LASTEXITCODE -ne 0) { throw 'Locked HIP detector SDK installation failed' }
            python scripts/build-rocm-detector.py --environment $environment --profile $id --output "python/rocm-detectors/$id"
            if ($LASTEXITCODE -ne 0) { throw 'Pinned HIP detector build failed' }
          }
      - name: Upload shared lock and detector resources
        uses: actions/upload-artifact@v4
        with:
          name: rocm-runtime-resources
          path: |
            python/runtime-manifest.json
            python/runtime-locks
            python/rocm-detectors
          if-no-files-found: error
      - name: Upload verified binary wheelhouse for preparation
        uses: actions/upload-artifact@v4
        with:
          name: rocm-runtime-wheelhouse
          path: release/rocm-runtime-assets
          compression-level: 0
          if-no-files-found: error
      - name: Assemble Online release assets
        shell: pwsh
        run: |
          $version = $env:PYMSS_VERSION_INPUT.TrimStart('v')
          New-Item -ItemType Directory -Force 'release/rocm-runtime-public' | Out-Null
          Copy-Item 'release/rocm-runtime-assets/wheels/*.whl' 'release/rocm-runtime-public/'
          Copy-Item 'release/rocm-runtime-assets/*.json' 'release/rocm-runtime-public/'
          "artifact_name=Pymss-Studio-$version-windows-x64-rocm-runtime-assets" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: release/rocm-runtime-public
          compression-level: 0
          if-no-files-found: error

  windows-cuda-prepare:
    name: Windows x64 CUDA prepare
    runs-on: windows-latest
    timeout-minutes: 180
    needs: [windows-rocm-runtime-assets, windows-bundled-tools]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stage_name: ${{ steps.meta.outputs.stage_name }}
      stage_artifact: ${{ steps.meta.outputs.stage_artifact }}
    env:
      PYMSS_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-release-env

      - uses: actions/download-artifact@v4
        with:
          name: rocm-runtime-resources
          path: python

      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = $env:PYMSS_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Invalid semantic version: $env:PYMSS_VERSION_INPUT" }
          $stageName = "Pymss-Studio-$version-windows-x64-cuda"
          $artifactName = "$stageName-stage"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "stage_name=$stageName" >> $env:GITHUB_OUTPUT
          echo "stage_artifact=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Prepare bootstrap runtime + CUDA environment seed
        shell: pwsh
        run: ./scripts/prepare-python-runtime.ps1 -Variant cuda -InitialBackend cuda
      - name: Verify prepared CUDA core snapshot
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          & 'python-runtime/runtime-envs/cuda/Scripts/python.exe' -I scripts/resolve-release-core.py python/runtime-manifest.json --verify
          if ($LASTEXITCODE -ne 0) { throw 'Prepared runtime differs from the release core snapshot' }
          & 'python-runtime/runtime-envs/cuda/Scripts/python.exe' -I -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Prepared runtime has incompatible dependencies' }

      - name: Sync build version metadata
        shell: pwsh
        env:
          PYMSS_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/sync-build-version.ps1

      - name: Build Tauri production app
        env:
          PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
          PYMSS_BUILD_GIT_TAG: v${{ steps.meta.outputs.version }}
          PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
          PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
          PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
          PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYMSS_BUILD_TARGET: windows-x64
          PYMSS_BUILD_VARIANT: windows-x64-cuda
          PYMSS_BUILD_UPDATE_SUPPORTED: 'true'
          PYMSS_BUILD_OFFICIAL: ${{ github.repository == 'pymss-project/pymss-studio' && github.repository_owner == 'pymss-project' && 'true' || 'false' }}
        run: pnpm plugins:build --no-bundle

      - name: Download shared Windows bundled tools
        uses: actions/download-artifact@v4
        with:
          name: windows-bundled-tools
          path: release/bin

      - name: Stage portable directory
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/pymss-studio.exe" "$stage/Pymss Studio.exe"
          Copy-Item "python" "$stage/python" -Recurse
          Copy-Item "python-runtime" "$stage/python-runtime" -Recurse
          Copy-Item "release/bin" "$stage/bin" -Recurse
          ./scripts/stage-plugin-sdk.ps1 -StagePath $stage
          ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          @"
          Pymss Studio $version Windows x64 CUDA
          Author: TheSmallHanCat

          This package includes a base Python runtime and a CUDA environment.
          NVIDIA driver is required for GPU acceleration.
          Users can switch backends or install additional environments in Settings.
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8
          $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR = (Resolve-Path "$stage/python-runtime/runtime-envs").Path
          $env:PYMSS_STUDIO_ACTIVE_RUNTIME_FILE = (Join-Path $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR "active-runtime.json")
          $activeStatePath = Join-Path $stage "python-runtime/runtime-envs/active-runtime.json"
          if (!(Test-Path $activeStatePath)) { throw "Staged CUDA active runtime state is missing" }
          $activeState = Get-Content -Raw $activeStatePath | ConvertFrom-Json
          if ($activeState.backend -ne "cuda") { throw "Staged CUDA active runtime backend is '$($activeState.backend)'" }
          $activePython = Join-Path (Join-Path $stage "python-runtime/runtime-envs") $activeState.pythonPath
          if (!(Test-Path $activePython)) { throw "Staged CUDA active runtime Python is missing: $activePython" }
          if (!(Test-Path "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe")) { throw "Staged CUDA Python executable is missing" }
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA pip is missing" }
          $probeVenv = Join-Path $stage "python-runtime\runtime-envs\_pip-smoke"
          & "$stage\python-runtime\python.exe" -m venv $probeVenv
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA venv creation failed" }
          & "$probeVenv\Scripts\python.exe" -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA venv pip is missing" }
          Remove-Item $probeVenv -Recurse -Force
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" "$stage\python\worker.py" env_info
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA env_info failed with exit code $LASTEXITCODE" }
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" -c "import pymss.graph; print('pymss.graph ok')"
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA pymss.graph import failed" }
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" "$stage\python\worker.py" list_models --payload "{}"
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA list_models failed with exit code $LASTEXITCODE" }
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" "$stage\python\runtime_audio_probe.py" --check-core
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA audio decoding failed with exit code $LASTEXITCODE" }
          ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -TemplateRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          $workspacePattern = [regex]::Escape((Resolve-Path ".").Path)
          $leakedConfig = Get-ChildItem "$stage/python-runtime/runtime-envs" -Recurse -File |
            Where-Object { $_.Extension -in @('.cfg', '.json', '.txt', '.ini') } |
            Select-String -Pattern $workspacePattern -List
          if ($leakedConfig) { throw "CI workspace path leaked into staged CUDA runtime env config" }

      - name: Verify staged native plugin helper
        shell: pwsh
        run: |
          python scripts/verify-native-plugins.py "release/${{ steps.meta.outputs.stage_name }}/Pymss Studio.exe" --platform windows
          if ($LASTEXITCODE -ne 0) { throw "Staged native plugin helper verification failed" }
      - name: Upload CUDA stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0

  windows-cuda-7z:
    name: Windows x64 CUDA portable 7z
    runs-on: windows-latest
    timeout-minutes: 120
    needs: windows-cuda-prepare
    steps:
      - name: Download CUDA stage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-cuda-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-cuda-prepare.outputs.stage_name }}

      - name: Build Windows portable 7z archive
        shell: pwsh
        run: |
          $version = '${{ needs.windows-cuda-prepare.outputs.version }}'
          $stageName = '${{ needs.windows-cuda-prepare.outputs.stage_name }}'
          if (Test-Path "release/$stageName.7z") { Remove-Item "release/$stageName.7z" -Force }
          Set-Content "release/$stageName/pymss-studio.portable" -Value "portable" -Encoding ASCII
           Push-Location "release"
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=768m -ms=on -mf=BCJ2 -mmt=on "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the CUDA portable archive" }
           Pop-Location

      - name: Upload Windows portable archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pymss-Studio-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-portable
          path: release/${{ needs.windows-cuda-prepare.outputs.stage_name }}.7z

  windows-cuda-exe:
    name: Windows x64 CUDA setup exe
    runs-on: windows-latest
    timeout-minutes: 120
    needs: windows-cuda-prepare
    env:
      PYMSS_VERSION: ${{ needs.windows-cuda-prepare.outputs.version }}
      PYMSS_PACKAGE_SUFFIX: windows-x64-cuda
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ needs.windows-cuda-prepare.outputs.version }}
          package-suffix: windows-x64-cuda
          stage-name: ${{ needs.windows-cuda-prepare.outputs.stage_name }}
          stage-artifact: ${{ needs.windows-cuda-prepare.outputs.stage_artifact }}
          output-artifact: Pymss-Studio-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-setup
          output-file: Pymss-Studio-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-setup.exe

  windows-cpu-prepare:
    name: Windows x64 CPU prepare
    runs-on: windows-latest
    timeout-minutes: 180
    needs: [windows-rocm-runtime-assets, windows-bundled-tools]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stage_name: ${{ steps.meta.outputs.stage_name }}
      stage_artifact: ${{ steps.meta.outputs.stage_artifact }}
    env:
      PYMSS_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-release-env

      - uses: actions/download-artifact@v4
        with:
          name: rocm-runtime-resources
          path: python

      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = $env:PYMSS_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Invalid semantic version: $env:PYMSS_VERSION_INPUT" }
          $stageName = "Pymss-Studio-$version-windows-x64-cpu"
          $artifactName = "$stageName-stage"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "stage_name=$stageName" >> $env:GITHUB_OUTPUT
          echo "stage_artifact=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Prepare bootstrap runtime + CPU environment seed
        shell: pwsh
        run: ./scripts/prepare-python-runtime.ps1 -Variant default -InitialBackend cpu
      - name: Verify prepared CPU core snapshot
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          & 'python-runtime/runtime-envs/cpu/Scripts/python.exe' -I scripts/resolve-release-core.py python/runtime-manifest.json --verify
          if ($LASTEXITCODE -ne 0) { throw 'Prepared runtime differs from the release core snapshot' }
          & 'python-runtime/runtime-envs/cpu/Scripts/python.exe' -I -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Prepared runtime has incompatible dependencies' }

      - name: Sync build version metadata
        shell: pwsh
        env:
          PYMSS_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/sync-build-version.ps1

      - name: Build Tauri production app
        env:
          PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
          PYMSS_BUILD_GIT_TAG: v${{ steps.meta.outputs.version }}
          PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
          PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
          PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
          PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYMSS_BUILD_TARGET: windows-x64
          PYMSS_BUILD_VARIANT: windows-x64-cpu
          PYMSS_BUILD_UPDATE_SUPPORTED: 'true'
          PYMSS_BUILD_OFFICIAL: ${{ github.repository == 'pymss-project/pymss-studio' && github.repository_owner == 'pymss-project' && 'true' || 'false' }}
        run: pnpm plugins:build --no-bundle

      - name: Download shared Windows bundled tools
        uses: actions/download-artifact@v4
        with:
          name: windows-bundled-tools
          path: release/bin

      - name: Stage portable directory
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/pymss-studio.exe" "$stage/Pymss Studio.exe"
          Copy-Item "python" "$stage/python" -Recurse
          Copy-Item "python-runtime" "$stage/python-runtime" -Recurse
          Copy-Item "release/bin" "$stage/bin" -Recurse
          ./scripts/stage-plugin-sdk.ps1 -StagePath $stage
           ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          @"
          Pymss Studio $version Windows x64 CPU
          Author: TheSmallHanCat

          This package includes a base Python runtime and a CPU environment.
          It is intended for users without NVIDIA CUDA GPUs.
          Users can switch backends or install additional environments in Settings.
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8
          $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR = (Resolve-Path "$stage/python-runtime/runtime-envs").Path
          $env:PYMSS_STUDIO_ACTIVE_RUNTIME_FILE = (Join-Path $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR "active-runtime.json")
          $activeStatePath = Join-Path $stage "python-runtime/runtime-envs/active-runtime.json"
          if (!(Test-Path $activeStatePath)) { throw "Staged CPU active runtime state is missing" }
          $activeState = Get-Content -Raw $activeStatePath | ConvertFrom-Json
          if ($activeState.backend -ne "cpu") { throw "Staged CPU active runtime backend is '$($activeState.backend)'" }
          $activePython = Join-Path (Join-Path $stage "python-runtime/runtime-envs") $activeState.pythonPath
          if (!(Test-Path $activePython)) { throw "Staged CPU active runtime Python is missing: $activePython" }
          if (!(Test-Path "$stage\python-runtime\runtime-envs\cpu\Scripts\python.exe")) { throw "Staged CPU Python executable is missing" }
          & "$stage\python-runtime\runtime-envs\cpu\Scripts\python.exe" "$stage\python\worker.py" env_info
          if ($LASTEXITCODE -ne 0) { throw "Staged CPU env_info failed with exit code $LASTEXITCODE" }
          & "$stage\python-runtime\runtime-envs\cpu\Scripts\python.exe" -c "import pymss.graph; print('pymss.graph ok')"
          if ($LASTEXITCODE -ne 0) { throw "Staged CPU pymss.graph import failed" }
          & "$stage\python-runtime\runtime-envs\cpu\Scripts\python.exe" "$stage\python\worker.py" list_models --payload "{}"
          if ($LASTEXITCODE -ne 0) { throw "Staged CPU list_models failed with exit code $LASTEXITCODE" }
           ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -TemplateRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          $workspacePattern = [regex]::Escape((Resolve-Path ".").Path)
           $leakedConfig = Get-ChildItem "$stage/python-runtime/runtime-envs" -Recurse -File |
            Where-Object { $_.Extension -in @('.cfg', '.json', '.txt', '.ini') } |
            Select-String -Pattern $workspacePattern -List
          if ($leakedConfig) { throw "CI workspace path leaked into staged CPU runtime env config" }

      - name: Verify staged native plugin helper
        shell: pwsh
        run: |
          python scripts/verify-native-plugins.py "release/${{ steps.meta.outputs.stage_name }}/Pymss Studio.exe" --platform windows
          if ($LASTEXITCODE -ne 0) { throw "Staged native plugin helper verification failed" }
      - name: Upload CPU stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0

  windows-cpu-7z:
    name: Windows x64 CPU portable 7z
    runs-on: windows-latest
    timeout-minutes: 120
    needs: windows-cpu-prepare
    steps:
      - name: Download CPU stage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-cpu-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-cpu-prepare.outputs.stage_name }}

      - name: Build Windows CPU portable 7z archive
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-cpu-prepare.outputs.stage_name }}'
          if (Test-Path "release/$stageName.7z") { Remove-Item "release/$stageName.7z" -Force }
          Set-Content "release/$stageName/pymss-studio.portable" -Value "portable" -Encoding ASCII
           Push-Location "release"
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=768m -ms=on -mf=BCJ2 -mmt=on "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the CPU portable archive" }
           Pop-Location

      - name: Upload Windows CPU portable archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pymss-Studio-${{ needs.windows-cpu-prepare.outputs.version }}-windows-x64-cpu-portable
