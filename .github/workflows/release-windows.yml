name: Release Windows Packages

on:
  workflow_call:
    inputs:
      version:
        description: Release version
        required: true
        type: string

jobs:
  windows-cuda-prepare:
    name: Windows x64 CUDA prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stage_name: ${{ steps.meta.outputs.stage_name }}
      stage_artifact: ${{ steps.meta.outputs.stage_artifact }}
    env:
      PYMSS_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-release-env

      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = $env:PYMSS_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Invalid semantic version: $env:PYMSS_VERSION_INPUT" }
          $stageName = "Pymss-Studio-$version-windows-x64-cuda"
          $artifactName = "$stageName-stage"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "stage_name=$stageName" >> $env:GITHUB_OUTPUT
          echo "stage_artifact=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Prepare bootstrap runtime + CUDA environment seed
        shell: pwsh
        run: ./scripts/prepare-python-runtime.ps1 -Variant cuda -InitialBackend cuda

      - name: Sync build version metadata
        shell: pwsh
        env:
          PYMSS_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/sync-build-version.ps1

      - name: Build Tauri production app
        env:
          PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
          PYMSS_BUILD_GIT_TAG: v${{ steps.meta.outputs.version }}
          PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
          PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
          PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
          PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYMSS_BUILD_TARGET: windows-x64
          PYMSS_BUILD_VARIANT: windows-x64-cuda
          PYMSS_BUILD_UPDATE_SUPPORTED: 'true'
          PYMSS_BUILD_OFFICIAL: ${{ github.repository == 'pymss-project/pymss-studio' && github.repository_owner == 'pymss-project' && 'true' || 'false' }}
        run: pnpm tauri build --no-bundle

      - name: Prepare Windows bundled tools
        shell: pwsh
        run: |
          $bin = "release/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          $ffmpegZip = "release/ffmpeg-release-essentials.zip"
          $ffmpegExtract = "release/ffmpeg"
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile $ffmpegZip
          if (Test-Path $ffmpegExtract) { Remove-Item $ffmpegExtract -Recurse -Force }
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegBin = Get-ChildItem -Path $ffmpegExtract -Recurse -Directory -Filter "bin" |
            Where-Object { Test-Path (Join-Path $_.FullName "ffmpeg.exe") } |
            Select-Object -First 1
          if (-not $ffmpegBin) { throw "ffmpeg bin directory not found" }
          Copy-Item (Join-Path $ffmpegBin.FullName "ffmpeg.exe") "$bin/ffmpeg.exe" -Force
          Copy-Item (Join-Path $ffmpegBin.FullName "ffprobe.exe") "$bin/ffprobe.exe" -Force
          $ffprobeOutput = & "$bin/ffprobe.exe" -version
          $ffprobeExitCode = $LASTEXITCODE
          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExitCode -ne 0) { throw "ffprobe.exe verification failed with exit code $ffprobeExitCode" }

          $aria2Zip = "release/aria2-1.37.0-win-64bit-build1.zip"
          $aria2Extract = "release/aria2"
          Invoke-WebRequest `
            -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" `
            -OutFile $aria2Zip
          if (Test-Path $aria2Extract) { Remove-Item $aria2Extract -Recurse -Force }
          Expand-Archive -Path $aria2Zip -DestinationPath $aria2Extract -Force
          $aria2Exe = Get-ChildItem -Path $aria2Extract -Recurse -File -Filter "aria2c.exe" | Select-Object -First 1
          if (-not $aria2Exe) { throw "aria2c.exe not found" }
          Copy-Item $aria2Exe.FullName "$bin/aria2c.exe" -Force

          $vcRedist = "$bin/VC_redist.x64.exe"
          if (Test-Path $vcRedist) { Remove-Item $vcRedist -Force }
          & curl.exe --location --fail --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 --output $vcRedist "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $vcRedist)) { throw "VC_redist.x64.exe download failed with exit code $LASTEXITCODE" }

      - name: Stage portable directory
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/pymss-studio.exe" "$stage/Pymss Studio.exe"
          Copy-Item "python" "$stage/python" -Recurse
          Copy-Item "python-runtime" "$stage/python-runtime" -Recurse
          Copy-Item "release/bin" "$stage/bin" -Recurse
          ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          @"
          Pymss Studio $version Windows x64 CUDA
          Author: TheSmallHanCat

          This package includes a base Python runtime and a CUDA environment.
          NVIDIA driver is required for GPU acceleration.
          Users can switch backends or install additional environments in Settings.
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8
          $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR = (Resolve-Path "$stage/python-runtime/runtime-envs").Path
          $env:PYMSS_STUDIO_ACTIVE_RUNTIME_FILE = (Join-Path $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR "active-runtime.json")
          $activeStatePath = Join-Path $stage "python-runtime/runtime-envs/active-runtime.json"
          if (!(Test-Path $activeStatePath)) { throw "Staged CUDA active runtime state is missing" }
          $activeState = Get-Content -Raw $activeStatePath | ConvertFrom-Json
          if ($activeState.backend -ne "cuda") { throw "Staged CUDA active runtime backend is '$($activeState.backend)'" }
          $activePython = Join-Path (Join-Path $stage "python-runtime/runtime-envs") $activeState.pythonPath
          if (!(Test-Path $activePython)) { throw "Staged CUDA active runtime Python is missing: $activePython" }
          if (!(Test-Path "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe")) { throw "Staged CUDA Python executable is missing" }
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA pip is missing" }
          $probeVenv = Join-Path $stage "python-runtime\runtime-envs\_pip-smoke"
          & "$stage\python-runtime\python.exe" -m venv $probeVenv
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA venv creation failed" }
          & "$probeVenv\Scripts\python.exe" -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA venv pip is missing" }
          Remove-Item $probeVenv -Recurse -Force
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" "$stage\python\worker.py" env_info
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA env_info failed with exit code $LASTEXITCODE" }
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" -c "import pymss.graph; print('pymss.graph ok')"
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA pymss.graph import failed" }
          & "$stage\python-runtime\runtime-envs\cuda\Scripts\python.exe" "$stage\python\worker.py" list_models --payload "{}"
          if ($LASTEXITCODE -ne 0) { throw "Staged CUDA list_models failed with exit code $LASTEXITCODE" }
          ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -TemplateRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          $workspacePattern = [regex]::Escape((Resolve-Path ".").Path)
          $leakedConfig = Get-ChildItem "$stage/python-runtime/runtime-envs" -Recurse -File |
            Where-Object { $_.Extension -in @('.cfg', '.json', '.txt', '.ini') } |
            Select-String -Pattern $workspacePattern -List
          if ($leakedConfig) { throw "CI workspace path leaked into staged CUDA runtime env config" }

      - name: Upload CUDA stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0

  windows-cuda-7z:
    name: Windows x64 CUDA portable 7z
    runs-on: windows-latest
    needs: windows-cuda-prepare
    steps:
      - name: Download CUDA stage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-cuda-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-cuda-prepare.outputs.stage_name }}

      - name: Build Windows portable 7z archive
        shell: pwsh
        run: |
          $version = '${{ needs.windows-cuda-prepare.outputs.version }}'
          $stageName = '${{ needs.windows-cuda-prepare.outputs.stage_name }}'
          if (Test-Path "release/$stageName.7z") { Remove-Item "release/$stageName.7z" -Force }
          Set-Content "release/$stageName/pymss-studio.portable" -Value "portable" -Encoding ASCII
           Push-Location "release"
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=768m -ms=on -mf=BCJ2 -mmt=on "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the CUDA portable archive" }
           Pop-Location

      - name: Upload Windows portable archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pymss-Studio-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-portable
          path: release/${{ needs.windows-cuda-prepare.outputs.stage_name }}.7z

  windows-cuda-exe:
    name: Windows x64 CUDA setup exe
    runs-on: windows-latest
    needs: windows-cuda-prepare
    env:
      PYMSS_VERSION: ${{ needs.windows-cuda-prepare.outputs.version }}
      PYMSS_PACKAGE_SUFFIX: windows-x64-cuda
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ needs.windows-cuda-prepare.outputs.version }}
          package-suffix: windows-x64-cuda
          stage-name: ${{ needs.windows-cuda-prepare.outputs.stage_name }}
          stage-artifact: ${{ needs.windows-cuda-prepare.outputs.stage_artifact }}
          output-artifact: Pymss-Studio-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-setup
          output-file: Pymss-Studio-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-setup.exe

  windows-cpu-prepare:
    name: Windows x64 CPU prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stage_name: ${{ steps.meta.outputs.stage_name }}
      stage_artifact: ${{ steps.meta.outputs.stage_artifact }}
    env:
      PYMSS_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-release-env

      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = $env:PYMSS_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Invalid semantic version: $env:PYMSS_VERSION_INPUT" }
          $stageName = "Pymss-Studio-$version-windows-x64-cpu"
          $artifactName = "$stageName-stage"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "stage_name=$stageName" >> $env:GITHUB_OUTPUT
          echo "stage_artifact=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Prepare bootstrap runtime + CPU environment seed
        shell: pwsh
        run: ./scripts/prepare-python-runtime.ps1 -Variant default -InitialBackend cpu

      - name: Sync build version metadata
        shell: pwsh
        env:
          PYMSS_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/sync-build-version.ps1

      - name: Build Tauri production app
        env:
          PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
          PYMSS_BUILD_GIT_TAG: v${{ steps.meta.outputs.version }}
          PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
          PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
          PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
          PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYMSS_BUILD_TARGET: windows-x64
          PYMSS_BUILD_VARIANT: windows-x64-cpu
          PYMSS_BUILD_UPDATE_SUPPORTED: 'true'
          PYMSS_BUILD_OFFICIAL: ${{ github.repository == 'pymss-project/pymss-studio' && github.repository_owner == 'pymss-project' && 'true' || 'false' }}
        run: pnpm tauri build --no-bundle

      - name: Prepare Windows bundled tools
        shell: pwsh
        run: |
          $bin = "release/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          $ffmpegZip = "release/ffmpeg-release-essentials.zip"
          $ffmpegExtract = "release/ffmpeg"
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile $ffmpegZip
          if (Test-Path $ffmpegExtract) { Remove-Item $ffmpegExtract -Recurse -Force }
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegBin = Get-ChildItem -Path $ffmpegExtract -Recurse -Directory -Filter "bin" |
            Where-Object { Test-Path (Join-Path $_.FullName "ffmpeg.exe") } |
            Select-Object -First 1
          if (-not $ffmpegBin) { throw "ffmpeg bin directory not found" }
          Copy-Item (Join-Path $ffmpegBin.FullName "ffmpeg.exe") "$bin/ffmpeg.exe" -Force
          Copy-Item (Join-Path $ffmpegBin.FullName "ffprobe.exe") "$bin/ffprobe.exe" -Force
          $ffprobeOutput = & "$bin/ffprobe.exe" -version
          $ffprobeExitCode = $LASTEXITCODE
          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExitCode -ne 0) { throw "ffprobe.exe verification failed with exit code $ffprobeExitCode" }

          $aria2Zip = "release/aria2-1.37.0-win-64bit-build1.zip"
          $aria2Extract = "release/aria2"
          Invoke-WebRequest `
            -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" `
            -OutFile $aria2Zip
          if (Test-Path $aria2Extract) { Remove-Item $aria2Extract -Recurse -Force }
          Expand-Archive -Path $aria2Zip -DestinationPath $aria2Extract -Force
          $aria2Exe = Get-ChildItem -Path $aria2Extract -Recurse -File -Filter "aria2c.exe" | Select-Object -First 1
          if (-not $aria2Exe) { throw "aria2c.exe not found" }
          Copy-Item $aria2Exe.FullName "$bin/aria2c.exe" -Force

          $vcRedist = "$bin/VC_redist.x64.exe"
          if (Test-Path $vcRedist) { Remove-Item $vcRedist -Force }
          & curl.exe --location --fail --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 --output $vcRedist "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $vcRedist)) { throw "VC_redist.x64.exe download failed with exit code $LASTEXITCODE" }

      - name: Stage portable directory
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/pymss-studio.exe" "$stage/Pymss Studio.exe"
          Copy-Item "python" "$stage/python" -Recurse
          Copy-Item "python-runtime" "$stage/python-runtime" -Recurse
          Copy-Item "release/bin" "$stage/bin" -Recurse
           ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          @"
          Pymss Studio $version Windows x64 CPU
          Author: TheSmallHanCat

          This package includes a base Python runtime and a CPU environment.
          It is intended for users without NVIDIA CUDA GPUs.
          Users can switch backends or install additional environments in Settings.
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8
          $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR = (Resolve-Path "$stage/python-runtime/runtime-envs").Path
          $env:PYMSS_STUDIO_ACTIVE_RUNTIME_FILE = (Join-Path $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR "active-runtime.json")
          $activeStatePath = Join-Path $stage "python-runtime/runtime-envs/active-runtime.json"
          if (!(Test-Path $activeStatePath)) { throw "Staged CPU active runtime state is missing" }
          $activeState = Get-Content -Raw $activeStatePath | ConvertFrom-Json
          if ($activeState.backend -ne "cpu") { throw "Staged CPU active runtime backend is '$($activeState.backend)'" }
          $activePython = Join-Path (Join-Path $stage "python-runtime/runtime-envs") $activeState.pythonPath
          if (!(Test-Path $activePython)) { throw "Staged CPU active runtime Python is missing: $activePython" }
          if (!(Test-Path "$stage\python-runtime\runtime-envs\cpu\Scripts\python.exe")) { throw "Staged CPU Python executable is missing" }
          & "$stage\python-runtime\runtime-envs\cpu\Scripts\python.exe" "$stage\python\worker.py" env_info
          if ($LASTEXITCODE -ne 0) { throw "Staged CPU env_info failed with exit code $LASTEXITCODE" }
          & "$stage\python-runtime\runtime-envs\cpu\Scripts\python.exe" -c "import pymss.graph; print('pymss.graph ok')"
          if ($LASTEXITCODE -ne 0) { throw "Staged CPU pymss.graph import failed" }
          & "$stage\python-runtime\runtime-envs\cpu\Scripts\python.exe" "$stage\python\worker.py" list_models --payload "{}"
          if ($LASTEXITCODE -ne 0) { throw "Staged CPU list_models failed with exit code $LASTEXITCODE" }
           ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -TemplateRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          $workspacePattern = [regex]::Escape((Resolve-Path ".").Path)
           $leakedConfig = Get-ChildItem "$stage/python-runtime/runtime-envs" -Recurse -File |
            Where-Object { $_.Extension -in @('.cfg', '.json', '.txt', '.ini') } |
            Select-String -Pattern $workspacePattern -List
          if ($leakedConfig) { throw "CI workspace path leaked into staged CPU runtime env config" }

      - name: Upload CPU stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0

  windows-cpu-7z:
    name: Windows x64 CPU portable 7z
    runs-on: windows-latest
    needs: windows-cpu-prepare
    steps:
      - name: Download CPU stage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-cpu-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-cpu-prepare.outputs.stage_name }}

      - name: Build Windows CPU portable 7z archive
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-cpu-prepare.outputs.stage_name }}'
          if (Test-Path "release/$stageName.7z") { Remove-Item "release/$stageName.7z" -Force }
          Set-Content "release/$stageName/pymss-studio.portable" -Value "portable" -Encoding ASCII
           Push-Location "release"
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=768m -ms=on -mf=BCJ2 -mmt=on "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the CPU portable archive" }
           Pop-Location

      - name: Upload Windows CPU portable archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pymss-Studio-${{ needs.windows-cpu-prepare.outputs.version }}-windows-x64-cpu-portable
          path: release/${{ needs.windows-cpu-prepare.outputs.stage_name }}.7z

  windows-cpu-exe:
    name: Windows x64 CPU setup exe
    runs-on: windows-latest
    needs: windows-cpu-prepare
    env:
      PYMSS_VERSION: ${{ needs.windows-cpu-prepare.outputs.version }}
      PYMSS_PACKAGE_SUFFIX: windows-x64-cpu
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ needs.windows-cpu-prepare.outputs.version }}
          package-suffix: windows-x64-cpu
          stage-name: ${{ needs.windows-cpu-prepare.outputs.stage_name }}
          stage-artifact: ${{ needs.windows-cpu-prepare.outputs.stage_artifact }}
          output-artifact: Pymss-Studio-${{ needs.windows-cpu-prepare.outputs.version }}-windows-x64-cpu-setup
          output-file: Pymss-Studio-${{ needs.windows-cpu-prepare.outputs.version }}-windows-x64-cpu-setup.exe


  windows-online-prepare:
    name: Windows x64 online runtime prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stage_name: ${{ steps.meta.outputs.stage_name }}
      stage_artifact: ${{ steps.meta.outputs.stage_artifact }}
    env:
      PYMSS_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-release-env
      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = $env:PYMSS_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Invalid semantic version: $env:PYMSS_VERSION_INPUT" }
          $stageName = "Pymss-Studio-$version-windows-x64-online"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "stage_name=$stageName" >> $env:GITHUB_OUTPUT
          echo "stage_artifact=$stageName-stage" >> $env:GITHUB_OUTPUT
      - name: Prepare minimal Python runtime
        shell: pwsh
        run: ./scripts/prepare-python-runtime.ps1 -Variant default -Minimal
      - name: Sync build version metadata
        shell: pwsh
        env:
          PYMSS_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/sync-build-version.ps1
      - name: Build Tauri production app
        env:
          PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
          PYMSS_BUILD_GIT_TAG: v${{ steps.meta.outputs.version }}
          PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
          PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
          PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
          PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYMSS_BUILD_TARGET: windows-x64
          PYMSS_BUILD_VARIANT: windows-x64-managed
          PYMSS_BUILD_UPDATE_SUPPORTED: 'true'
          PYMSS_BUILD_OFFICIAL: ${{ github.repository == 'pymss-project/pymss-studio' && github.repository_owner == 'pymss-project' && 'true' || 'false' }}
        run: pnpm tauri build --no-bundle
      - name: Prepare Windows bundled tools
        shell: pwsh
        run: |
          $bin = "release/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "release/ffmpeg.zip"
          Expand-Archive -Path "release/ffmpeg.zip" -DestinationPath "release/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "release/ffmpeg" -Recurse -File -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe not found" }
          Copy-Item $ffmpeg.FullName "$bin/ffmpeg.exe" -Force
          $ffprobe = Get-ChildItem "release/ffmpeg" -Recurse -File -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffprobe) { throw "ffprobe.exe not found" }
          Copy-Item $ffprobe.FullName "$bin/ffprobe.exe" -Force
          $ffprobeOutput = & "$bin/ffprobe.exe" -version
          $ffprobeExitCode = $LASTEXITCODE
          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExitCode -ne 0) { throw "ffprobe.exe verification failed with exit code $ffprobeExitCode" }
          Invoke-WebRequest -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile "release/aria2.zip"
          Expand-Archive -Path "release/aria2.zip" -DestinationPath "release/aria2" -Force
          $aria2 = Get-ChildItem "release/aria2" -Recurse -File -Filter "aria2c.exe" | Select-Object -First 1
          if (-not $aria2) { throw "aria2c.exe not found" }
          Copy-Item $aria2.FullName "$bin/aria2c.exe" -Force
          $vcRedist = "$bin/VC_redist.x64.exe"
          if (Test-Path $vcRedist) { Remove-Item $vcRedist -Force }
          & curl.exe --location --fail --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 --output $vcRedist "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $vcRedist)) { throw "VC_redist.x64.exe download failed with exit code $LASTEXITCODE" }
      - name: Stage online portable directory
        shell: pwsh
        run: |
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/pymss-studio.exe" "$stage/Pymss Studio.exe"
          Copy-Item "python" "$stage/python" -Recurse
          Copy-Item "python-runtime" "$stage/python-runtime" -Recurse
          Copy-Item "release/bin" "$stage/bin" -Recurse
          @"
          Pymss Studio ${{ steps.meta.outputs.version }} Windows x64 Online
          This package installs the selected CPU, CUDA, or ROCm environment on first start.
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $probeVenv = Join-Path $stage "python-runtime\runtime-envs\_pip-smoke"
          & "$stage\python-runtime\python.exe" -m venv $probeVenv
          if ($LASTEXITCODE -ne 0) { throw "Online runtime venv creation failed" }
          & "$probeVenv\Scripts\python.exe" -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "Online runtime venv pip is missing" }
          Remove-Item $probeVenv -Recurse -Force
          & "$stage\python-runtime\python.exe" "$stage\python\worker.py" runtime_info --payload "{}"
           if ($LASTEXITCODE -ne 0) { throw "Online runtime bootstrap check failed" }
           Get-ChildItem "$stage\python" -Recurse -Directory -Filter "__pycache__" |
             Remove-Item -Recurse -Force
           Get-ChildItem "$stage\python" -Recurse -File -Include "*.pyc", "*.pyo" |
             Remove-Item -Force
      - name: Upload online stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0
  windows-online-7z:
    name: Windows x64 online portable 7z
    runs-on: windows-latest
    needs: windows-online-prepare
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-online-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-online-prepare.outputs.stage_name }}
      - name: Build online portable archive
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-online-prepare.outputs.stage_name }}'
          Set-Content "release/$stageName/pymss-studio.portable" -Value "portable" -Encoding ASCII
          $updateArchive = (Resolve-Path "release").Path + "\Pymss-Studio-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-update.zip"
           Push-Location release
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=768m -ms=on -mf=BCJ2 -mmt=on "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the Online portable archive" }
           Pop-Location
           Push-Location "release/$stageName"
           # Keep bundled tools in the portable archive only. Add bin here when a tool update needs to be distributed.
           & "C:\Program Files\7-Zip\7z.exe" a -tzip $updateArchive "Pymss Studio.exe" "python"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create the managed update archive" }
          Pop-Location
          $updateSize = (Get-Item -LiteralPath $updateArchive).Length
          if ($updateSize -gt 512MB) { throw "Managed update archive exceeds the 512 MiB client limit" }
      - uses: actions/upload-artifact@v4
        with:
          name: Pymss-Studio-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-online-portable
          path: release/${{ needs.windows-online-prepare.outputs.stage_name }}.7z
      - name: Upload universal Windows update archive
        uses: actions/upload-artifact@v4
        with:
          name: Pymss-Studio-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-update
          path: release/Pymss-Studio-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-update.zip

  windows-online-exe:
    name: Windows x64 online setup exe
    runs-on: windows-latest
    needs: windows-online-prepare
    env:
      PYMSS_VERSION: ${{ needs.windows-online-prepare.outputs.version }}
      PYMSS_PACKAGE_SUFFIX: windows-x64-online
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ needs.windows-online-prepare.outputs.version }}
          package-suffix: windows-x64-online
          stage-name: ${{ needs.windows-online-prepare.outputs.stage_name }}
          stage-artifact: ${{ needs.windows-online-prepare.outputs.stage_artifact }}
          output-artifact: Pymss-Studio-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-online-setup
          output-file: Pymss-Studio-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-online-setup.exe

  windows-rocm-prepare:
    name: Windows x64 ROCm prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stage_name: ${{ steps.meta.outputs.stage_name }}
      stage_artifact: ${{ steps.meta.outputs.stage_artifact }}
    env:
      PYMSS_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-release-env
      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = $env:PYMSS_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Invalid semantic version: $env:PYMSS_VERSION_INPUT" }
          $stageName = "Pymss-Studio-$version-windows-x64-rocm"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "stage_name=$stageName" >> $env:GITHUB_OUTPUT
          echo "stage_artifact=$stageName-stage" >> $env:GITHUB_OUTPUT
      - name: Prepare bootstrap runtime + ROCm environment seed
        shell: pwsh
        run: ./scripts/prepare-python-runtime.ps1 -Variant rocm -InitialBackend rocm
      - name: Sync build version metadata
        shell: pwsh
        env:
          PYMSS_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/sync-build-version.ps1
      - name: Build Tauri production app
        env:
          PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
          PYMSS_BUILD_GIT_TAG: v${{ steps.meta.outputs.version }}
          PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
          PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
          PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
          PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYMSS_BUILD_TARGET: windows-x64
          PYMSS_BUILD_VARIANT: windows-x64-rocm
          PYMSS_BUILD_UPDATE_SUPPORTED: 'true'
          PYMSS_BUILD_OFFICIAL: ${{ github.repository == 'pymss-project/pymss-studio' && github.repository_owner == 'pymss-project' && 'true' || 'false' }}
        run: pnpm tauri build --no-bundle
      - name: Prepare ROCm portable tools
        shell: pwsh
        run: |
          $bin = "release/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "release/ffmpeg.zip"
          Expand-Archive -Path "release/ffmpeg.zip" -DestinationPath "release/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "release/ffmpeg" -Recurse -File -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "$bin/ffmpeg.exe" -Force
          $ffprobe = Get-ChildItem "release/ffmpeg" -Recurse -File -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffprobe) { throw "ffprobe.exe not found" }
          Copy-Item $ffprobe.FullName "$bin/ffprobe.exe" -Force
          $ffprobeOutput = & "$bin/ffprobe.exe" -version
          $ffprobeExitCode = $LASTEXITCODE
          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExitCode -ne 0) { throw "ffprobe.exe verification failed with exit code $ffprobeExitCode" }
          Invoke-WebRequest -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile "release/aria2.zip"
          Expand-Archive -Path "release/aria2.zip" -DestinationPath "release/aria2" -Force
          $aria2 = Get-ChildItem "release/aria2" -Recurse -File -Filter "aria2c.exe" | Select-Object -First 1
          Copy-Item $aria2.FullName "$bin/aria2c.exe" -Force
          $vcRedist = "$bin/VC_redist.x64.exe"
          if (Test-Path $vcRedist) { Remove-Item $vcRedist -Force }
          & curl.exe --location --fail --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 --output $vcRedist "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $vcRedist)) { throw "VC_redist.x64.exe download failed with exit code $LASTEXITCODE" }
      - name: Stage ROCm portable directory
        shell: pwsh
        run: |
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/pymss-studio.exe" "$stage/Pymss Studio.exe"
          Copy-Item "python" "$stage/python" -Recurse
          Copy-Item "python-runtime" "$stage/python-runtime" -Recurse
          Copy-Item "release/bin" "$stage/bin" -Recurse
          ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          if (Test-Path "$stage\python-runtime\runtime-envs\rocm\Scripts\offload-arch.exe") { throw "Staged ROCm offload-arch launcher still embeds the build Python path" }
          $rocmSdkPackage = Get-ChildItem "$stage\python-runtime\runtime-envs\rocm\Lib\site-packages" -Directory -Filter "_rocm_sdk_core*" |
            Select-Object -First 1
          if (-not $rocmSdkPackage) { throw "Staged ROCm SDK core package is missing" }
          $rocmNativeTools = Join-Path $rocmSdkPackage.FullName "lib\llvm\bin"
          $rocmRuntimeBin = Join-Path $rocmSdkPackage.FullName "bin"
          if (!(Test-Path (Join-Path $rocmNativeTools "offload-arch.exe"))) { throw "Staged ROCm native offload-arch tool is missing" }
          if (!(Test-Path $rocmRuntimeBin)) { throw "Staged ROCm runtime DLL directory is missing" }
          $env:PATH = "$rocmNativeTools;$rocmRuntimeBin;$env:PATH"
          @"
          Pymss Studio ${{ steps.meta.outputs.version }} Windows x64 ROCm
          This package includes a base Python runtime and a ROCm environment.
          Requires Windows 11, a supported AMD GPU, and the matching AMD driver.
          Users can switch backends or install additional environments in Settings.
          "@ | Set-Content "$stage/README.txt" -Encoding UTF8
          $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR = (Resolve-Path "$stage/python-runtime/runtime-envs").Path
          $env:PYMSS_STUDIO_ACTIVE_RUNTIME_FILE = (Join-Path $env:PYMSS_STUDIO_RUNTIME_ENVS_DIR "active-runtime.json")
          $activeStatePath = Join-Path $stage "python-runtime/runtime-envs/active-runtime.json"
          if (!(Test-Path $activeStatePath)) { throw "Staged ROCm active runtime state is missing" }
          $activeState = Get-Content -Raw $activeStatePath | ConvertFrom-Json
          if ($activeState.backend -ne "rocm") { throw "Staged ROCm active runtime backend is '$($activeState.backend)'" }
          $activePython = Join-Path (Join-Path $stage "python-runtime/runtime-envs") $activeState.pythonPath
          if (!(Test-Path $activePython)) { throw "Staged ROCm active runtime Python is missing: $activePython" }
          if (!(Test-Path "$stage\python-runtime\runtime-envs\rocm\Scripts\python.exe")) { throw "Staged ROCm Python executable is missing" }
          & "$stage\python-runtime\runtime-envs\rocm\Scripts\python.exe" "$stage\python\worker.py" env_info
          if ($LASTEXITCODE -ne 0) { throw "Staged ROCm env_info failed" }
          & "$stage\python-runtime\runtime-envs\rocm\Scripts\python.exe" -c "import pymss.graph; print('pymss.graph ok')"
          if ($LASTEXITCODE -ne 0) { throw "Staged ROCm pymss.graph import failed" }
          & "$stage\python-runtime\runtime-envs\rocm\Scripts\python.exe" "$stage\python\worker.py" list_models --payload "{}"
          if ($LASTEXITCODE -ne 0) { throw "Staged ROCm list_models failed" }
          ./scripts/prepare-python-runtime.ps1 -RewriteRuntimeEnvConfigs -TemplateRuntimeEnvConfigs -RuntimeEnvsDir "$stage/python-runtime/runtime-envs" -RuntimeDir "$stage/python-runtime"
          $workspacePattern = [regex]::Escape((Resolve-Path ".").Path)
          $leakedConfig = Get-ChildItem "$stage/python-runtime/runtime-envs" -Recurse -File |
            Where-Object { $_.Extension -in @('.cfg', '.json', '.txt', '.ini') } |
            Select-String -Pattern $workspacePattern -List
          if ($leakedConfig) { throw "CI workspace path leaked into staged ROCm runtime env config" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0

  windows-rocm-7z:
    name: Windows x64 ROCm portable 7z
    runs-on: windows-latest
    needs: windows-rocm-prepare
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-rocm-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-rocm-prepare.outputs.stage_name }}
      - name: Build ROCm portable archive
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-rocm-prepare.outputs.stage_name }}'
          Set-Content "release/$stageName/pymss-studio.portable" -Value "portable" -Encoding ASCII
           Push-Location release
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=768m -ms=on -mf=BCJ2 -mmt=on "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the ROCm portable archive" }
           Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: Pymss-Studio-${{ needs.windows-rocm-prepare.outputs.version }}-windows-x64-rocm-portable
          path: release/${{ needs.windows-rocm-prepare.outputs.stage_name }}.7z

  windows-rocm-exe:
    name: Windows x64 ROCm setup exe
    runs-on: windows-latest
    needs: windows-rocm-prepare
    env:
      PYMSS_VERSION: ${{ needs.windows-rocm-prepare.outputs.version }}
      PYMSS_PACKAGE_SUFFIX: windows-x64-rocm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ needs.windows-rocm-prepare.outputs.version }}
          package-suffix: windows-x64-rocm
          stage-name: ${{ needs.windows-rocm-prepare.outputs.stage_name }}
          stage-artifact: ${{ needs.windows-rocm-prepare.outputs.stage_artifact }}
          output-artifact: Pymss-Studio-${{ needs.windows-rocm-prepare.outputs.version }}-windows-x64-rocm-setup
          output-file: Pymss-Studio-${{ needs.windows-rocm-prepare.outputs.version }}-windows-x64-rocm-setup.exe
