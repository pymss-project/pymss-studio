name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-process-cleanup:
    name: Worker process cleanup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pymss-project/pymss
          ref: d59b5b46ae61d937e1dc7976b3918979f0f4bcd2
          path: test-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native cancellation, retry, and unrelated process safety
        run: python tests/manual/worker_native_cancellation_smoke.py --gate test-core/pymss/operations/_command_bootstrap.py --report worker-process-cleanup.json

  runtime-safety:
    name: Runtime safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runtime plans, activation recovery, and offline package updates
        run: python -m unittest discover -s tests/python -t tests -p "test_runtime_core_*.py"
      - name: Verify runtime pruning and preparation probes
        run: |
          python -m unittest discover -s tests/python -t tests -p "test_runtime_pruning.py"
          python -m unittest discover -s tests/python -t tests -p "test_prepare_runtime_probe.py"
          python -m unittest discover -s tests/python -t tests -p "test_pymss_plugin_api.py"
          python -m unittest discover -s tests/python -t tests -p "test_release_core_resolution.py"
          python -m unittest discover -s tests/python -t tests -p "test_release_plan.py"
      - name: Verify optional components preserve the fixed runtime
        run: python -m unittest discover -s tests/python -t tests -p "test_worker_optional_packages.py"

  linux-native:
    name: Linux native runtime and backend
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libasound2-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Linux release and environment contracts
        run: python -m unittest discover -s tests/python -t tests -p 'test_linux_*.py'
      - name: Check backend and bootstrap relocation
        run: |
          python scripts/prepare-preinstalled-plugins.py --release
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml bootstrap_cache
          cargo test --manifest-path src-tauri/Cargo.toml linux_update
          cargo test --manifest-path src-tauri/Cargo.toml update_startup
          cargo test --manifest-path src-tauri/Cargo.toml trusted_digest_is_bound_to_the_same_bytes_as_the_signature
          cargo test --manifest-path src-tauri/Cargo.toml update_sources
          cargo test --manifest-path src-tauri/Cargo.toml single_instance

  macos-updater:
    name: macOS updater
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive generation and platform-specific installation
        run: |
          python scripts/prepare-preinstalled-plugins.py --release
          python -m unittest discover -s tests/python -t tests -p 'test_macos_update_release.py'
          cargo test --manifest-path src-tauri/Cargo.toml macos_update
          cargo test --manifest-path src-tauri/Cargo.toml update_startup
          cargo test --manifest-path src-tauri/Cargo.toml single_instance
          cargo test --manifest-path src-tauri/Cargo.toml bundled_bootstrap_uses_user_overlay_without_changing_bundle
      - name: Verify plugin resources and native protocol paths
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary -r python/requirements-ci.txt
          python -m unittest discover -s tests/python -t tests -p 'test_plugin_sdk_bundle.py'
          python -m unittest discover -s tests/python -t tests -p 'test_worker_operations.py'
          cargo test --manifest-path src-tauri/Cargo.toml plugin_views
          cargo test --manifest-path src-tauri/Cargo.toml python::worker

  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu
          python -m pip install --disable-pip-version-check --prefer-binary \
            -r python/requirements-ci.txt

      - name: Run all tests
        run: |
          pnpm plugins:prepare --release
          pnpm test:all

      - name: Build frontend
        run: pnpm build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  native:
    name: Native host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libasound2-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Check native host
        run: cargo check --locked --manifest-path native/Cargo.toml --workspace
      - name: Verify portable compatibility harness
        run: python -m unittest discover -s tests/manual -p test_vst_real_plugin_smoke.py
      - name: Verify audio graph, protocol and native fixture regressions
        run: cargo test --locked --manifest-path native/Cargo.toml -p pymss-audio-host --tests
      - name: Verify AAX package resolution and inspection ABI
        run: cargo test --locked --manifest-path native/Cargo.toml -p pymss-aax-probe
      - name: Verify isolated AAX module inspection
        if: runner.os != 'Linux'
        run: python tests/manual/aax_module_smoke.py --host native/target/debug/pymss-audio-host${{ runner.os == 'Windows' && '.exe' || '' }} --output-dir "${{ runner.temp }}/aax-module-checks"
      - name: Verify VST2 and Audio Unit adapters
        run: cargo test --locked --manifest-path native/Cargo.toml -p pymss-vst2-host -p soundcraft-au-host --lib
      - name: Verify SDK ownership and plugin lifecycle
        run: cargo test --locked --manifest-path native/Cargo.toml -p soundcraft-vst3-host
      - name: Verify VST3 restrictions through the isolated helper
        run: >-
          python tests/manual/vst_processing_restrictions_smoke.py
          --host native/target/debug/pymss-audio-host${{ runner.os == 'Windows' && '.exe' || '' }}
          --fixture-library native/target/tmp/vst3-fixture-target/debug/${{ runner.os == 'Windows' && 'vst3_fixture.dll' || runner.os == 'macOS' && 'libvst3_fixture.dylib' || 'libvst3_fixture.so' }}
          --output-dir "${{ runner.temp }}/vst3-restrictions"
      - name: Check experimental application bridge
        run: |
          python scripts/prepare-preinstalled-plugins.py --release
          cargo check --locked --manifest-path src-tauri/Cargo.toml --features vst-lab
      - name: Check native host with ordinary application identity
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features native-plugins
      - name: Verify process isolation and saved-state bridge
        run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --features vst-lab commands::plugin_host::'
      - name: Verify ordinary-identity plugin bridge
        run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-plugins commands::plugin_host::'
      - name: Verify guarded application quit requests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-plugins app_quit::tests
