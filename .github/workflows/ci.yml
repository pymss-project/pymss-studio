name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu
          python -m pip install --disable-pip-version-check --prefer-binary \
            -r python/requirements-ci.txt

      - name: Run all tests
        run: pnpm test:all

      - name: Build frontend
        run: pnpm build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
  installer-smoke:
    name: Installer migration smoke (MoInstaller)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MO_RELEASE: v0.2.1
    steps:
      - uses: actions/checkout@v4

      - name: Download mo CLI from MoInstaller releases
        shell: pwsh
        run: |
          $url = "https://github.com/HuanLinOTO/MoInstaller/releases/download/$env:MO_RELEASE/mo-x86_64-pc-windows-msvc.exe"
          curl.exe --location --fail --retry 5 --retry-all-errors --output mo.exe $url
          if ($LASTEXITCODE -ne 0 -or !(Test-Path mo.exe)) { throw 'mo.exe download failed' }

      - name: Stage smoke fixture tree
        shell: pwsh
        run: ./installer/tests-fixture/make-fixture.ps1

      - name: Build + install + upgrade + uninstall smoke
        shell: pwsh
        run: ./installer/tests-fixture/smoke.ps1 -MoPath "${{ github.workspace }}/mo.exe"
