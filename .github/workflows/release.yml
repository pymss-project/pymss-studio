name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.0.8"
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - windows
      publish:
        description: "Publish a GitHub Release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Publish and mark the GitHub Release as a pre-release"
        required: true
        default: false
        type: boolean
      allow_auto_update:
        description: "Allow this release to be installed through automatic updates"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows'
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}
    secrets: inherit

  macos:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos'
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}
    secrets: inherit

  github-release:
    name: Publish GitHub Release
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.prerelease == true))
      ) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}
      QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
      QUARKPAN_VERSION: "0.4.0"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          version="${RELEASE_VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION_INPUT" >&2
            exit 1
          fi
          version="${version#v}"
          release_tag="v${version}"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Pymss Studio v${version}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          windows_result="${{ needs.windows.result }}"
          if [[ "$windows_result" != "success" ]]; then
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
          elif [[ "$version" == *-* ]]; then
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_PRERELEASE=${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}" >> "$GITHUB_ENV"
          fi
          requested_auto_update="${{ github.event_name == 'workflow_dispatch' && inputs.allow_auto_update == true }}"
          previous_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -v "^${release_tag}$" | head -n 1 || true)"
          runtime_compatible=false
          if [[ -n "$previous_tag" ]] && git diff --quiet "$previous_tag" "$GITHUB_SHA" -- \
              python/ \
              scripts/prepare-python-runtime.ps1 \
              scripts/prepare-python-runtime.sh \
              scripts/prune-python-runtime.ps1 \
              scripts/prune-python-runtime.sh \
              src-tauri/src/python \
              src-tauri/src/storage.rs \
              src-tauri/tauri.conf.json \
              installer/pymss-studio.iss; then
            runtime_compatible=true
          fi
          if [[ "$requested_auto_update" == "true" && "$runtime_compatible" == "true" ]]; then
            echo "RELEASE_AUTO_UPDATE_SUPPORTED=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_AUTO_UPDATE_SUPPORTED=false" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_RUNTIME_COMPATIBLE=$runtime_compatible" >> "$GITHUB_ENV"
      - name: Download Windows portable artifacts
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-windows-x64-*-portable
      - name: Download Windows setup artifacts
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-windows-x64-*-setup
      - name: Download Windows update archives
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-windows-x64-update
      - name: Download macOS release artifacts
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-macos-*-mlx
      - name: Split oversized release assets
        shell: bash
        run: |
          set -euo pipefail
          max_size=$((2040 * 1024 * 1024))
          has_split=0

          shopt -s nullglob
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            if [ "$size" -gt "$max_size" ]; then
              echo "Splitting $(basename "$file") (${size} bytes)"
              sha256sum "$file" > "$file.sha256"
              split -b "$max_size" -d -a 3 "$file" "$file.part-"
              rm "$file"
              has_split=1
            fi
          done

          if [ "$has_split" = "1" ]; then
            cat > artifacts/SPLIT-ASSETS-README.txt <<'EOF'
          Some release assets are split because GitHub Releases require each file to be under 2 GiB.

          Linux/macOS:
            cat Pymss-Studio-xxx.part-* > Pymss-Studio-xxx
            sha256sum -c Pymss-Studio-xxx.sha256

          Windows CMD:
            copy /b Pymss-Studio-xxx.part-000+Pymss-Studio-xxx.part-001 Pymss-Studio-xxx

          Download all parts for the same filename before merging.
          EOF
          fi
      - name: Sign managed update assets
        if: needs.windows.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required to sign managed update assets" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(artifacts/*-windows-x64-update.zip)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected one universal Windows update archive, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          max_update_size=$((512 * 1024 * 1024))
          for file in "${files[@]}"; do
            if [ "$(stat -c%s "$file")" -gt "$max_update_size" ]; then
              echo "Managed update archive exceeds the 512 MiB client limit: $file" >&2
              exit 1
            fi
            pnpm dlx @tauri-apps/cli@2.11.0 signer sign "$file"
          done
      - name: Generate managed update metadata
        if: needs.windows.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          tag = os.environ["RELEASE_TAG"]
          prerelease = os.environ.get("RELEASE_PRERELEASE", "false").lower() == "true"
          channels = ("prerelease",) if prerelease else ("stable", "prerelease")
          auto_update_supported = os.environ.get("RELEASE_AUTO_UPDATE_SUPPORTED", "false").lower() == "true"
          manual_install = not auto_update_supported
          manual_message = "This release requires manual installation from GitHub because it contains breaking runtime changes." if manual_install else ""
          manual_url = f"https://github.com/pymss-project/pymss-studio/releases/tag/{tag}"
          generated = []
          asset = f"Pymss-Studio-{version}-windows-x64-update.zip"
          signature = Path(f"artifacts/{asset}.sig").read_text(encoding="utf-8").strip()
          for channel in channels:
              data = {
                  "version": version,
                  "notes": "See the GitHub release notes for details.",
                  "pub_date": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
                  "prerelease": prerelease,
                  "channel": channel,
                  "pymss_update_supported": not manual_install,
                  "pymss_requires_manual_install": manual_install,
                  "pymss_update_message": manual_message,
                  "pymss_manual_install_url": manual_url,
                  "platforms": {
                      "windows-x86_64": {
                          "signature": signature,
                          "url": f"https://github.com/pymss-project/pymss-studio/releases/download/{tag}/{asset}",
                      }
                  },
              }
              name = f"{channel}-v1-windows-x64-update.json"
              Path(f"artifacts/{name}").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              generated.append(name)
          Path("artifacts/managed-update-metadata.txt").write_text("\n".join(generated) + "\n", encoding="utf-8")
          PY
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS
      - name: Stage artifacts for mirror uploads
        if: ${{ env.QUARK_COOKIE != '' || env.HF_TOKEN != '' || env.MODELSCOPE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          staging="pms/${RELEASE_VERSION}"
          mkdir -p "$staging"
          shopt -s nullglob
          copied=0
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            # Hard-link to preserve complete archives before oversized GitHub assets are split.
            ln -f "$file" "$staging/"
            copied=$((copied + 1))
          done
          echo "Staged $copied file(s) under $staging/"
          ls -la "$staging"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          generate_release_notes: true
          files: artifacts/*

      - uses: softprops/action-gh-release@v2
        if: needs.windows.result == 'success'
        with:
          tag_name: updater
          name: Pymss Studio Update Channel
          body: Managed update metadata for Pymss Studio. This release is managed by CI.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: artifacts/*-windows-x64-*.json

      - name: Download Quark netdisk CLI
        if: ${{ env.QUARK_COOKIE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          asset="quarkpan-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/HuanLinOTO/quarkpan-rs/releases/download/v${QUARKPAN_VERSION}/${asset}"
          echo "Downloading $url"
          curl -L -f --retry 3 -o "$asset" "$url"
          curl -L -f --retry 3 -o "$asset.sha256" "$url.sha256"
          # Verify integrity of the downloaded tarball against the published SHA256.
          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"
          quarkpan_bin="$(find . -maxdepth 2 -type f -name quarkpan | head -n1)"
          if [ -z "$quarkpan_bin" ]; then
            echo "quarkpan binary not found after extraction" >&2
            exit 1
          fi
          chmod +x "$quarkpan_bin"
          echo "Using quarkpan at: $quarkpan_bin"
          "$quarkpan_bin" --version || true
          echo "QUARKPAN_BIN=$quarkpan_bin" >> "$GITHUB_ENV"

      - name: Upload release files to Quark netdisk
        if: ${{ env.QUARK_COOKIE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # quarkpan reads QUARK_COOKIE from the environment via clap's env attribute.
          echo "Uploading pms/${RELEASE_VERSION}/ to Quark netdisk (root → pms/${RELEASE_VERSION})"
          "$QUARKPAN_BIN" upload-dir --dir pms --pdir-fid 0 -c -o
          echo "Quark netdisk upload completed."

      - name: Set up uv
        if: ${{ env.HF_TOKEN != '' || env.MODELSCOPE_API_TOKEN != '' }}
        uses: astral-sh/setup-uv@v6

      - name: Upload release files to HuggingFace dataset
        if: ${{ env.HF_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Uploading pms/${RELEASE_VERSION}/ to HuggingFace dataset HuanLin/Pymss-Studio-Dist:${RELEASE_VERSION}"
          uvx --from "huggingface_hub[cli]" hf upload --type dataset HuanLin/Pymss-Studio-Dist "pms/${RELEASE_VERSION}" "${RELEASE_VERSION}"
          echo "HuggingFace dataset upload completed."

      - name: Upload release files to ModelScope dataset
        if: ${{ env.MODELSCOPE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Uploading pms/${RELEASE_VERSION}/ to ModelScope dataset huanlinoto/Pymss-Studio-Dist:${RELEASE_VERSION}"
          uvx modelscope upload --repo-type dataset huanlinoto/Pymss-Studio-Dist "pms/${RELEASE_VERSION}" "${RELEASE_VERSION}"
          echo "ModelScope dataset upload completed."
