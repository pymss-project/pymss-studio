name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example, 0.1.0)"
        required: true
        type: string
      target:
        description: "Build target"
        required: true
        default: all
        type: choice
        options: [all, windows, macos, linux]
      release_type:
        description: "Release mode"
        required: true
        default: build-only
        type: choice
        options: [build-only, prerelease, stable]
      allow_auto_update:
        description: "Allow installation through automatic updates"
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      target:
        default: all
        type: string
      release_type:
        default: build-only
        type: string
      allow_auto_update:
        default: false
        type: boolean
      rocm_profile:
        default: ""
        type: string
      rocm_preview_candidate:
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release and resolve shared core snapshot
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      target: ${{ steps.plan.outputs.target }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      allow_auto_update: ${{ steps.plan.outputs.allow_auto_update }}
      rocm_profile: ${{ steps.plan.outputs.rocm_profile }}
      rocm_revision: ${{ steps.plan.outputs.rocm_revision }}
      rocm_targets: ${{ steps.plan.outputs.rocm_targets }}
      rocm_channel: ${{ steps.plan.outputs.rocm_channel }}
      rocm_preview_candidate: ${{ steps.plan.outputs.rocm_preview_candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release inputs and derive runtime policy
        id: plan
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version || github.ref_name }}
          RELEASE_TARGET_INPUT: ${{ inputs.target || 'all' }}
          RELEASE_TYPE_INPUT: ${{ inputs.release_type }}
          RELEASE_AUTO_UPDATE_INPUT: ${{ inputs.allow_auto_update }}
          RELEASE_ROCM_PROFILE_INPUT: ${{ inputs.rocm_profile }}
          RELEASE_ROCM_PREVIEW_INPUT: ${{ inputs.rocm_preview_candidate }}
          RELEASE_COMMIT_INPUT: ${{ github.sha }}
        run: python scripts/resolve-release-plan.py
      - name: Resolve compatible stable release cores
        run: python scripts/resolve-release-core.py python/runtime-manifest.json
      - name: Upload shared core snapshot
        uses: actions/upload-artifact@v4
        with:
          name: release-core-manifest
          path: python/runtime-manifest.json
          if-no-files-found: error

  windows:
    name: Windows packages
    needs: preflight
    if: needs.preflight.outputs.target == 'all' || needs.preflight.outputs.target == 'windows'
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      core_manifest_artifact: release-core-manifest
      rocm_profile: ${{ needs.preflight.outputs.rocm_profile }}
      rocm_profile_revision: ${{ fromJSON(needs.preflight.outputs.rocm_revision) }}
      rocm_targets: ${{ needs.preflight.outputs.rocm_targets }}
      rocm_channel: ${{ needs.preflight.outputs.rocm_channel }}
      rocm_preview_candidate: ${{ needs.preflight.outputs.rocm_preview_candidate == 'true' }}
    secrets: inherit

  macos:
    name: macOS packages
    needs: preflight
    if: needs.preflight.outputs.target == 'all' || needs.preflight.outputs.target == 'macos'
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      core_manifest_artifact: release-core-manifest
    secrets: inherit

  linux:
    name: Linux AppImage
    needs: preflight
    if: needs.preflight.outputs.target == 'all' || needs.preflight.outputs.target == 'linux'
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      core_manifest_artifact: release-core-manifest
    secrets: inherit

  github-release:
    name: Publish GitHub Release
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.publish == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [preflight, windows, macos, linux]
    # Release bodies and the shared updater channel must be published serially.
    concurrency:
      group: pymss-studio-release-publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION_INPUT: ${{ needs.preflight.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      RELEASE_AUTO_UPDATE_SUPPORTED: ${{ needs.preflight.outputs.allow_auto_update }}
      RELEASE_MACOS_AUTO_UPDATE_SUPPORTED: ${{ needs.preflight.outputs.allow_auto_update }}
      RELEASE_LINUX_AUTO_UPDATE_SUPPORTED: ${{ needs.preflight.outputs.allow_auto_update }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          version="$RELEASE_VERSION_INPUT"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Pymss Studio v${version}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          requested_auto_update="$RELEASE_AUTO_UPDATE_SUPPORTED"
          echo "Automatic update requested: $requested_auto_update"
          update_message=""
          if [[ "$requested_auto_update" != "true" ]]; then
            update_message="This release requires manual installation from GitHub because automatic updates were not enabled for this release."
          fi
          echo "RELEASE_UPDATE_MESSAGE=$update_message" >> "$GITHUB_ENV"
      - name: Download Windows portable artifacts
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-windows-x64-*-portable
      - name: Download Windows setup artifacts
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-windows-x64-*-setup
      - name: Download Windows ROCm runtime assets
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-windows-x64-rocm-runtime-assets
      - name: Download Windows update archives
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-windows-x64-update
      - name: Download macOS release artifacts
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-macos-*-mlx
      - name: Download Linux release artifacts
        if: needs.linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: Pymss-Studio-${{ steps.release_meta.outputs.version }}-linux-x64-appimage
      - name: Validate release asset sizes
        shell: bash
        run: |
          set -euo pipefail
          max_size=$((2 * 1024 * 1024 * 1024))

          shopt -s nullglob
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            if [ "$size" -ge "$max_size" ]; then
              echo "::error::Release asset must be smaller than 2 GiB: $(basename "$file") (${size} bytes)"
              exit 1
            fi
          done
      - name: Sign managed update assets
        if: needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success'
        shell: bash
        env:
          WINDOWS_BUILD_RESULT: ${{ needs.windows.result }}
          MACOS_BUILD_RESULT: ${{ needs.macos.result }}
          LINUX_BUILD_RESULT: ${{ needs.linux.result }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required to sign managed update assets" >&2
            exit 1
          fi
          shopt -s nullglob
          files=()
          if [ "$WINDOWS_BUILD_RESULT" = "success" ]; then
            windows=(artifacts/*-windows-x64-update.zip)
            if [ "${#windows[@]}" -ne 1 ]; then
              echo "Expected one Windows update archive" >&2
              exit 1
            fi
            files+=("${windows[@]}")
          fi
          if [ "$MACOS_BUILD_RESULT" = "success" ]; then
            macos=(artifacts/*-macos-arm64-update.app.tar.gz)
            if [ "${#macos[@]}" -ne 1 ]; then
              echo "Expected one macOS update archive" >&2
              exit 1
            fi
            files+=("${macos[@]}")
          fi
          if [ "$LINUX_BUILD_RESULT" = "success" ]; then
            linux=(artifacts/*-linux-x64.AppImage)
            if [ "${#linux[@]}" -ne 1 ]; then
              echo "Expected one Linux AppImage" >&2
              exit 1
            fi
            files+=("${linux[@]}")
          fi
          for file in "${files[@]}"; do
            max_update_size=$((2 * 1024 * 1024 * 1024 - 1))
            if [[ "$file" == *-windows-x64-update.zip ]]; then
              max_update_size=$((512 * 1024 * 1024))
            fi
            if [ "$(stat -c%s "$file")" -gt "$max_update_size" ]; then
              echo "Managed update archive exceeds its platform size limit: $file" >&2
              exit 1
            fi
            pnpm dlx @tauri-apps/cli@2.11.0 signer sign "$file"
          done
      - name: Generate managed update metadata
        if: needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success'
        run: python3 scripts/generate-update-metadata.py
      - name: Prepare reviewed release notes
        id: release_notes
        shell: bash
        env:
          RELEASE_NOTES_OUTPUT: ${{ runner.temp }}/pymss-release-notes.md
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f ".github/release-notes/${RELEASE_VERSION}.md" ]]; then
            python3 scripts/generate-release-notes.py --include-published --output "$RELEASE_NOTES_OUTPUT"
            echo "body_path=$RELEASE_NOTES_OUTPUT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No reviewed notes for ${RELEASE_VERSION}; using GitHub-generated release notes."
          fi
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS
      - name: Stage artifacts for mirror uploads
        id: stage_mirrors
        if: ${{ env.HF_TOKEN != '' || env.MODELSCOPE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          staging="pms/${RELEASE_VERSION}"
          mkdir -p "$staging"
          shopt -s nullglob
          copied=0
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            # Hard-link release assets into the mirror staging directory.
            ln -f "$file" "$staging/"
            copied=$((copied + 1))
          done
          echo "Staged $copied file(s) under $staging/"
          ls -la "$staging"
      - name: Verify release tag commit
        run: python3 scripts/resolve-release-plan.py --verify-tag "$RELEASE_TAG" "$GITHUB_SHA"
      - uses: softprops/action-gh-release@v2
        id: publish_release
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: true
          files: artifacts/*

      - uses: softprops/action-gh-release@v2
        if: needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success'
        with:
          tag_name: updater
          name: Pymss Studio Update Channel
          body: Managed update metadata for Pymss Studio. This release is managed by CI.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: artifacts/*-v1-*-update.json

      - name: Set up uv
        id: setup_mirror_uploads
        if: ${{ !cancelled() && steps.stage_mirrors.outcome == 'success' && steps.publish_release.outcome == 'success' && (env.HF_TOKEN != '' || env.MODELSCOPE_API_TOKEN != '') }}
        uses: astral-sh/setup-uv@v6

      - name: Upload release files to HuggingFace dataset
        if: ${{ !cancelled() && steps.setup_mirror_uploads.outcome == 'success' && env.HF_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Uploading pms/${RELEASE_VERSION}/ to HuggingFace dataset HuanLin/Pymss-Studio-Dist:${RELEASE_VERSION}"
          uvx --from "huggingface_hub[cli]" hf upload --type dataset HuanLin/Pymss-Studio-Dist "pms/${RELEASE_VERSION}" "${RELEASE_VERSION}"
          echo "HuggingFace dataset upload completed."

      - name: Upload release files to ModelScope dataset
        if: ${{ !cancelled() && steps.setup_mirror_uploads.outcome == 'success' && env.MODELSCOPE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Uploading pms/${RELEASE_VERSION}/ to ModelScope dataset huanlinoto/Pymss-Studio-Dist:${RELEASE_VERSION}"
          uvx modelscope upload --repo-type dataset huanlinoto/Pymss-Studio-Dist "pms/${RELEASE_VERSION}" "${RELEASE_VERSION}"
          echo "ModelScope dataset upload completed."
