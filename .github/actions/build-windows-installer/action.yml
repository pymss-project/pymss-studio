name: Build Windows installer
description: Build and upload a MoInstaller-based setup.exe from a staged Windows package
inputs:
  version:
    description: Normalized package version
    required: true
  package-suffix:
    description: Installer package suffix
    required: true
  stage-name:
    description: Staged package directory name
    required: true
  stage-artifact:
    description: Staged package artifact name
    required: true
  output-artifact:
    description: Uploaded installer artifact name
    required: true
  output-file:
    description: Generated installer filename
    required: true
runs:
  using: composite
  steps:
    - name: Download mo CLI from MoInstaller releases
      shell: pwsh
      env:
        MO_RELEASE: v0.2.7
      run: |
        $url = "https://github.com/HuanLinOTO/MoInstaller/releases/download/$env:MO_RELEASE/mo-x86_64-pc-windows-msvc.exe"
        curl.exe --location --fail --retry 5 --retry-all-errors --output mo.exe $url
        if ($LASTEXITCODE -ne 0 -or !(Test-Path mo.exe)) { throw 'mo.exe download failed' }
    - name: Download staged package
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.stage-artifact }}
        path: release/${{ inputs.stage-name }}
    - name: Render manifest and build setup.exe
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $stageName = '${{ inputs.stage-name }}'
        $outFile = 'release/${{ inputs.output-file }}'
        # staged payload lives under installer/stage/<stage-name>/ (glob base = installer/)
        New-Item -ItemType Directory -Force -Path installer/stage | Out-Null
        Move-Item ("release/" + $stageName) ("installer/stage/" + $stageName)
        $tpl = Get-Content installer/installer.toml.in -Raw
        $manifest = $tpl -replace '__PYMSS_VERSION__', '${{ inputs.version }}' -replace '__STAGE_NAME__', $stageName
        Set-Content installer/installer.toml -Value $manifest -NoNewline -Encoding utf8
        & (Join-Path $env:GITHUB_WORKSPACE 'mo.exe') build installer/installer.toml --out $outFile
        if ($LASTEXITCODE -ne 0) { throw "mo build failed with exit code $LASTEXITCODE" }
        if (!(Test-Path $outFile)) { throw "installer was not produced at $outFile" }
        Remove-Item installer/installer.toml -Force
        Remove-Item installer/stage -Recurse -Force
    - name: Upload Windows installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.output-artifact }}
        path: release/${{ inputs.output-file }}
