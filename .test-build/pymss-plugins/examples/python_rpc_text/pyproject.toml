[project]
name = "pymss-plugin-python-rpc-text"
version = "0.1.0"
description = "Normalize text line endings using an isolated Python process"
requires-python = ">=3.11"
dependencies = []

[tool.pymss.plugin]
id = "example.python_rpc_text"
api_version = 2
requires_pymss = ">=2.2"

[[tool.pymss.plugin.operations]]
id = "example.python_rpc_text.normalize"
title = "Normalize text line endings"

[[tool.pymss.plugin.contributions.nodes]]
type = "example_python_rpc_text_normalize"
title = "Normalize text line endings"
category = "files/text"
inputs = [{name = "source", type = "STRING"}, {name = "line_ending", type = "STRING"}]
outputs = [{name = "document", type = "STRING"}]

[tool.pymss.python]
format_version = 1
lock = "python-lock.json"

[tool.pymss.rpc_process]
format_version = 1

[[tool.pymss.rpc_process.operations]]
id = "example.python_rpc_text.normalize"
title = "Normalize text line endings"
description = "Convert UTF-8 text to LF or CRLF line endings"
node_type = "example_python_rpc_text_normalize"
timeout = 30
protocol_version = 1
permissions = ["host.taskInfo", "host.fileInfo"]
host_timeout = 5
max_output_bytes = 134217728
arguments = []
python = "peer.py"

[tool.pymss.rpc_process.operations.inputs.source]
type = "file"
title = "Input text file"
extensions = ["txt", "csv", "md", "json", "srt", "lrc"]

[tool.pymss.rpc_process.operations.params]
type = "object"
additionalProperties = false

[tool.pymss.rpc_process.operations.params.properties.line_ending]
type = "string"
title = "Line endings"
enum = ["lf", "crlf"]
default = "lf"

[tool.pymss.rpc_process.operations.outputs.document]
type = "file"
filename = "normalized.txt"
media_type = "text/plain"

[tool.pymss.studio]
sdk_version = 1
category = "convert"
platforms = ["win32", "darwin", "linux"]
architectures = ["x86_64", "arm64"]
required_capabilities = ["app.info", "files.pickFile", "files.pickDirectory", "files.reveal", "operations.describe", "operations.start", "operations.cancel"]

[tool.pymss.studio.locales.en]
title = "Text conversion"
description = "Convert UTF-8 text to LF or CRLF line endings."

[tool.pymss.studio.locales."zh-CN"]
title = "文本转换"
description = "将 UTF-8 文本转换为 LF 或 CRLF 换行。"

[[tool.pymss.studio.views]]
id = "tool"
title = "Text conversion"
entry = "ui/index.html"
placements = ["tool"]
operation = "example.python_rpc_text.normalize"
permissions = ["app.info", "files.pickFile", "files.pickDirectory", "files.reveal", "operations.describe", "operations.start", "operations.cancel"]
