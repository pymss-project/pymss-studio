[package]
name = "pymss-studio"
version = "0.0.12"
edition = "2021"
authors = ["TheSmallHanCat"]

[features]
default = ["native-plugins"]
native-plugins = ["dep:pymss-audio-host"]
vst-lab = ["native-plugins"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
reqwest = { version = "0.13", default-features = false, features = ["socks", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
percent-encoding = "2"
tempfile = "3"
thiserror = "2"
trash = "5"
url = "2"
chrono = "0.4"
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rustfft = "6.4"
sha2 = "0.10"
pymss-audio-host = { path = "../native/audio-host", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
tar = "0.4"

[dev-dependencies]
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

# Keep line-level debugging for application code while avoiding oversized MSVC
# program databases generated from the complete Tauri dependency graph.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
